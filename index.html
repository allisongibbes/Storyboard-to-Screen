<style>
  /* Container setup to maintain aspect ratio and keep everything contained */
  .comparison-widget {
    position: relative;
    width: 100%;
    max-width: 800px;
    margin: 20px auto;
    overflow: hidden;
    border: 2px solid #333;
    border-radius: 8px;
    background-color: #000;
  }

  /* Base styles for both images */
  .comparison-widget img {
    display: block;
    width: 100%;
    height: auto;
    pointer-events: none;
    user-select: none;
  }

  /* The storyboard image sits on top and will be clipped by JavaScript */
  .image-storyboard {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    clip-path: inset(0 50% 0 0); /* Initial state: cropped exactly in the middle */
  }

  /* The invisible slider that users actually interact with */
  .slider-input {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    cursor: ew-resize;
    z-index: 10;
    margin: 0;
  }

  /* The visual dividing line */
  .slider-line {
    position: absolute;
    top: 0;
    left: 50%;
    width: 4px;
    height: 100%;
    background: white;
    transform: translateX(-50%);
    z-index: 5;
    pointer-events: none;
    box-shadow: 0 0 10px rgba(0,0,0,0.8);
  }

  /* The circular drag handle in the center of the line */
  .slider-button {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    background: white;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    z-index: 5;
    pointer-events: none;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 10px rgba(0,0,0,0.5);
  }

  /* Creating the left/right arrows inside the button using pure CSS */
  .slider-button::before, .slider-button::after {
    content: '';
    width: 0;
    height: 0;
    border-top: 6px solid transparent;
    border-bottom: 6px solid transparent;
  }
  .slider-button::before {
    border-right: 8px solid #333;
    margin-right: 4px;
  }
  .slider-button::after {
    border-left: 8px solid #333;
    margin-left: 4px;
  }
</style>

<div class="comparison-widget">
  <!-- Base Image (The Final Animated Frame goes here) -->
  <img src="https://via.placeholder.com/800x450/4CAF50/FFFFFF?text=Final+Animated+Frame" alt="Final Animated Frame" class="image-final">
  
  <!-- Overlay Image (The Storyboard Sketch goes here) -->
  <img src="https://via.placeholder.com/800x450/9E9E9E/FFFFFF?text=Storyboard+Sketch" alt="Storyboard Sketch" class="image-storyboard" id="storyboardOverlay">
  
  <!-- Visual Elements -->
  <div class="slider-line" id="dragLine"></div>
  <div class="slider-button" id="dragBtn"></div>
  
  <!-- Interactive Range Input -->
  <input type="range" min="0" max="100" value="50" class="slider-input" id="interactionSlider">
</div>

<script>
  // Target the HTML elements
  const slider = document.getElementById('interactionSlider');
  const storyboard = document.getElementById('storyboardOverlay');
  const dragLine = document.getElementById('dragLine');
  const dragBtn = document.getElementById('dragBtn');

  // Update image clipping and visual slider position when the user drags the input
  slider.addEventListener('input', (event) => {
    const sliderValue = event.target.value;
    
    // Adjust the clip-path to reveal the image underneath
    // 'inset(top right bottom left)' -> We change the 'right' crop amount
    storyboard.style.clipPath = `inset(0 ${100 - sliderValue}% 0 0)`;
    
    // Move the visual line and button horizontally
    dragLine.style.left = `${sliderValue}%`;
    dragBtn.style.left = `${sliderValue}%`;
  });
</script>
